	<body>
		<script>
			(function() {
				try {
					var stored = localStorage.getItem('officeil-theme')
					var mode = stored === 'light' || stored === 'dark' ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
					document.documentElement.setAttribute('data-theme', mode)
					document.documentElement.style.colorScheme = mode
				} catch (e) {}
			})()

		</script>
		<div id="root"></div>
